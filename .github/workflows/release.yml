# GitHub Actions：tag 触发自动构建并发布 GitHub Release。
#
# 触发：推送形如 v0.1.0 / v1.2.3 的 tag。
# 流程：
#   1) checkout（含 Git LFS 拉取内置运行时归档）
#   2) 安装 Go 1.25 + Node 20 + Wails CLI + NSIS
#   3) wails build（前端 npm ci && npm run build → 嵌入二进制 → NSIS 打包成 installer.exe）
#   4) 上传 build/bin/WorkBaby-amd64-installer.exe 到 GitHub Release，自动生成 release notes
#
# 设计取舍：
#   - 仅 windows-latest：项目目前只面向 Windows amd64（CLAUDE.md / doc/14 一致）。
#   - 不上传 WorkBaby.exe（无 NSIS 打包）：用户场景是绿色安装；纯 exe 提供给高级用户，
#     必要时可手动从 Actions artifacts 下载再扩展。
#   - 缓存 npm + Go modules：~30% 时间节省；缓存键绑 Go 版本避免版本漂移。
#   - 失败产物保留为 Actions artifacts：便于本地复现与排错。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发：测试流水线（不会上传到正式 Release）

permissions:
  contents: write  # 创建 Release + 上传资产

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout（含 LFS）
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0  # 让 NSIS / wails 能拿到完整版本元信息

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS（NSIS 3.10 用于 build/windows/installer/project.nsi）
        uses: nschloe/setup-nsis@v1

      - name: Wails doctor（环境自检）
        run: wails doctor

      - name: 门禁脚本（核心包测试 + 分层 + 前端类型 + 单测）
        shell: pwsh
        run: ./scripts/test.ps1 -Full

      - name: Wails 构建（前端 npm ci → 嵌入 → NSIS 打包）
        run: wails build -clean -platform windows/amd64 -skipbindings -trimpath

      - name: 验证产物
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/WorkBaby.exe')) { throw "WorkBaby.exe missing" }
          if (-not (Test-Path 'build/bin/WorkBaby-amd64-installer.exe')) { throw "WorkBaby-amd64-installer.exe missing" }
          Write-Host "Build artifacts OK"

      # 失败时保留产物供本地排查；成功后直接上传到 Release（不重复留 artifacts）。
      - name: 上传失败诊断包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbaby-windows-debug
          path: |
            build/bin/
            !build/bin/runtimes/
          retention-days: 7

      - name: 创建 GitHub Release 并上传安装器
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WorkBaby ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/bin/WorkBaby-amd64-installer.exe
